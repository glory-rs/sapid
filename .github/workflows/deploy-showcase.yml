name: Deploy Sapid showcase to Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sapid-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILD_ROOT: D:/BuildCache/sapid/pages-ci
  CARGO_HOME: D:/BuildCache/sapid/pages-ci/cargo
  CARGO_TARGET_DIR: D:/BuildCache/sapid/pages-ci/target
  RUSTUP_HOME: D:/BuildCache/sapid/pages-ci/rustup
  TEMP: D:/BuildCache/sapid/pages-ci/tmp
  TMP: D:/BuildCache/sapid/pages-ci/tmp
  PYTHONPYCACHEPREFIX: D:/BuildCache/sapid/pages-ci/pycache
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  npm_config_cache: D:/BuildCache/sapid/pages-ci/npm
  PLAYWRIGHT_BROWSERS_PATH: D:/BuildCache/sapid/pages-ci/browsers
  WRANGLER_SEND_METRICS: 'false'
  PYTHONUTF8: '1'
jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: sapid
    steps:
      - name: Preserve repository line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sapid
          persist-credentials: false
      - name: Check out coordinated development engines
        shell: bash
        run: |
          if [ ! -d ../apace/.git ]; then git clone --depth 1 https://github.com/glory-rs/apace ../apace; fi
          if [ ! -d ../takia/.git ]; then git clone --depth 1 https://github.com/glory-rs/takia ../takia; fi
          if [ ! -d ../wingy/.git ]; then git clone --depth 1 https://github.com/glory-rs/wingy ../wingy; fi
      - name: Read Glory revision
        id: dependency
        run: |
          $dependency = (Get-Content deploy/dependencies.json -Raw | ConvertFrom-Json).glory
          if ($dependency.revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Glory revision' }
          "repository=$($dependency.repository)" >> $env:GITHUB_OUTPUT
          "revision=$($dependency.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: main
          path: glory
          persist-credentials: false
      - name: Prepare D drive
        run: |
          New-Item -ItemType Directory -Force $env:BUILD_ROOT,$env:CARGO_HOME,$env:CARGO_TARGET_DIR,$env:RUSTUP_HOME,$env:TEMP,D:/BuildCache/sapid/tmp | Out-Null
          "$env:CARGO_HOME/bin" >> $env:GITHUB_PATH
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            D:/BuildCache/sapid/pages-ci/cargo
            D:/BuildCache/sapid/pages-ci/rustup
            D:/BuildCache/sapid/pages-ci/target
            D:/BuildCache/sapid/pages-ci/tools
          key: sapid-pages-tools-v2-${{ runner.os }}-1.98.0-${{ hashFiles('sapid/Cargo.toml', 'sapid/examples/web/Cargo.lock', 'sapid/deploy/dependencies.json', 'sapid/deploy/build-tools.json', 'sapid/deploy/tools/package-lock.json') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Install verified build and deployment tools without credentials
        run: |
          $tools = ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT
          "SAPID_BINDGEN=$($tools.Bindgen)" >> $env:GITHUB_ENV
          "SAPID_PLAYWRIGHT=$($tools.Playwright)" >> $env:GITHUB_ENV
          "SAPID_TOOLS_RECEIPT_SHA256=$($tools.ReceiptSha256)" >> $env:GITHUB_ENV
          node (Join-Path $tools.Playwright 'cli.js') install chromium
          if ($LASTEXITCODE) { throw 'Chromium installation failed' }
      - name: Test tool integrity rejection paths
        run: python -m unittest discover -s scripts -p test_tools.py
      - name: Validate library and shared adapters
        run: ./scripts/check.ps1 -BuildRoot $env:BUILD_ROOT
      - name: Verify immutable assets and release retention
        run: python scripts/test-site-assets.py

      - name: Validate and build production showcase
        run: |
          ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT -VerifyOnly | Out-Null
          ./scripts/check-showcase.ps1 -Release -BuildRoot $env:BUILD_ROOT -Bindgen $env:SAPID_BINDGEN
      - name: Browser acceptance of actual release assets
        run: |
          ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT -VerifyOnly | Out-Null
          node scripts/showcase-acceptance.cjs --directory "$env:BUILD_ROOT/showcase" --output "$env:BUILD_ROOT/acceptance"
          if ($LASTEXITCODE) { throw 'Showcase acceptance failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sapid-showcase-dist
          path: |
            D:/BuildCache/sapid/pages-ci/showcase
            D:/BuildCache/sapid/pages-ci/acceptance
          if-no-files-found: warn
          retention-days: 30
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./scripts/deploy-pages.ps1 -Directory "$env:BUILD_ROOT/showcase" -BuildRoot $env:BUILD_ROOT

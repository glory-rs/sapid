name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to validate and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sapid-release
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      product_commit: ${{ steps.freeze.outputs.product_commit }}
      tag: ${{ steps.freeze.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Freeze the release tag before validation
        id: freeze
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git check-ref-format "refs/tags/$env:REQUESTED_TAG"
          if ($LASTEXITCODE) { throw 'Invalid release tag' }
          $commit = git rev-parse --verify "refs/tags/$env:REQUESTED_TAG^{commit}"
          if ($LASTEXITCODE -or $commit -notmatch '^[a-f0-9]{40}$') { throw 'Release tag must identify an existing commit' }
          if ($env:EVENT_NAME -eq 'push' -and $commit -ne $env:EVENT_COMMIT) { throw 'Release tag moved after the push event' }
          "product_commit=$commit" >> $env:GITHUB_OUTPUT
          "tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      release_ref: ${{ needs.resolve.outputs.product_commit }}
      acceptance_ref: ${{ github.sha }}
  publish:
    needs: [resolve, checks]
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      CARGO_HOME: D:/BuildCache/sapid-release/cargo
      CARGO_TARGET_DIR: D:/BuildCache/sapid-release/target
      RUSTUP_HOME: D:/BuildCache/sapid-release/rustup
      TEMP: D:/BuildCache/sapid-release/tmp
      TMP: D:/BuildCache/sapid-release/tmp
      PYTHONPYCACHEPREFIX: D:/BuildCache/sapid-release/pycache
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.product_commit }}
      ACCEPTANCE_COMMIT: ${{ github.sha }}
      ACCEPTANCE_ARTIFACT: ${{ needs.checks.outputs.acceptance_artifact }}
      ACCEPTANCE_PROVENANCE_SHA256: ${{ needs.checks.outputs.acceptance_provenance_sha256 }}
    defaults:
      run:
        shell: pwsh
        working-directory: sapid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: sapid
          ref: ${{ needs.resolve.outputs.product_commit }}
      - name: Check out workflow-versioned release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: |
            .gitattributes
            scripts/release.py
            scripts/browser.cjs
            examples/web/*acceptance.js
          sparse-checkout-cone-mode: false
      - name: Read the pinned Glory release source
        id: dependency
        run: |
          $dependency = (Get-Content deploy/dependencies.json -Raw | ConvertFrom-Json).glory
          if ($dependency.revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Glory source revision' }
          "repository=$($dependency.repository)" >> $env:GITHUB_OUTPUT
          "revision=$($dependency.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: ${{ steps.dependency.outputs.revision }}
          path: glory
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare compiler and storage
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_HOME,$env:CARGO_TARGET_DIR,$env:RUSTUP_HOME,$env:TEMP | Out-Null
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE) { throw 'Toolchain installation failed' }
          rustup default 1.98.0
      - name: Publish verified packages and GitHub release
        run: |
          $evidence = Join-Path $env:CARGO_TARGET_DIR 'browser-acceptance'
          if ($env:ACCEPTANCE_ARTIFACT -notmatch '^sapid-browser-acceptance-[1-9][0-9]*$') { throw 'Successful checks did not identify their acceptance artifact' }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ACCEPTANCE_ARTIFACT --dir $evidence
          if ($LASTEXITCODE) { throw 'Browser evidence download failed' }
          python ../release-tools/scripts/release.py --product-root . --harness-root ../release-tools --publish --tag $env:RELEASE_TAG --expected-commit $env:RELEASE_COMMIT --acceptance-commit $env:ACCEPTANCE_COMMIT --provenance (Join-Path $evidence 'browser-provenance.json')
          if ($LASTEXITCODE) { throw 'Release failed' }
      - name: Attach browser acceptance provenance
        run: |
          $evidence = Join-Path $env:CARGO_TARGET_DIR 'browser-acceptance'
          python ../release-tools/scripts/release.py --product-root . --harness-root ../release-tools --attach-acceptance --tag $env:RELEASE_TAG --expected-commit $env:RELEASE_COMMIT --acceptance-commit $env:ACCEPTANCE_COMMIT --provenance (Join-Path $evidence 'browser-provenance.json')
          if ($LASTEXITCODE) { throw 'Browser evidence upload failed' }

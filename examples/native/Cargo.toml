[package]
name = "sapid-native-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
files = ["glory/blitz-files", "dep:winit"]
clipboard = ["glory/blitz-clipboard"]

[dependencies]
sapid = { path = "../..", features = ["json", "code", "dates", "charts", "chat"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["html", "blitz-accesskit", "blitz-raster"] }
blitz-traits = { git = "https://github.com/glory-rs/blitz", rev = "ee125981e0e5a217e758be5c470df23cdd9e2fc3", version = "=0.3.0-beta.4", default-features = false }
blitz-dom = { git = "https://github.com/glory-rs/blitz", rev = "ee125981e0e5a217e758be5c470df23cdd9e2fc3", version = "=0.3.0-beta.4", default-features = false }

winit = { git = "https://github.com/glory-rs/winit", rev = "3b6f5a09697acb936567af64e53c915b0b1a2af9", version = "=0.31.0-beta.4", optional = true }

[lints.rust]
unsafe_code = "forbid"

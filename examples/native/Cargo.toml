[package]
name = "sapid-native-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
files = ["glory/apace-files", "dep:wingy"]
clipboard = ["glory/apace-clipboard"]

[dependencies]
sapid = { path = "../..", features = ["json", "code", "dates", "charts", "chat"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["html", "dsl", "apace-accesskit", "apace-raster"] }
apace-traits = { version = "=0.3.0-beta.4", default-features = false }
apace-dom = { version = "=0.3.0-beta.4", default-features = false }

wingy = { version = "=0.31.0", optional = true }

[lints.rust]
unsafe_code = "forbid"

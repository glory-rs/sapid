[package]
name = "sapid-native-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

rust-version = "1.95"

license = "Apache-2.0"

[workspace]

resolver = "3"
[features]
files = ["glory/apace-files", "dep:wingy"]
clipboard = ["glory/apace-clipboard"]

[dependencies]
sapid = { path = "../..", features = ["json", "code", "dates", "charts", "chat"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["html", "dsl", "apace-accesskit", "apace-raster"] }
apace-traits = { path = "../../../apace/packages/apace-traits", version = "=0.3.0", default-features = false }
apace-dom = { path = "../../../apace/packages/apace-dom", version = "=0.3.0", default-features = false }

wingy = { path = "../../../wingy/wingy", version = "=0.31.1", optional = true }

[lints.rust]
unsafe_code = "forbid"

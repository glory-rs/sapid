[package]
name = "sapid-native-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
files = ["glory/blitz-files"]
clipboard = ["glory/blitz-clipboard", "dep:blitz-traits", "dep:blitz-dom"]

[dependencies]
sapid = { path = "../..", features = ["json", "code", "dates", "charts", "chat"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["html", "blitz-accesskit", "blitz-raster"] }
blitz-traits = { git = "https://github.com/glory-rs/blitz", rev = "6a9ca05b246ecec6a7844e18dc6d264eb8f076cf", version = "=0.3.0-beta.4", default-features = false, optional = true }
blitz-dom = { git = "https://github.com/glory-rs/blitz", rev = "6a9ca05b246ecec6a7844e18dc6d264eb8f076cf", version = "=0.3.0-beta.4", default-features = false, optional = true }

[lints.rust]
unsafe_code = "forbid"

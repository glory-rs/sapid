[package]
name = "sapid-native-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
files = ["glory/blitz-files", "dep:winit"]
clipboard = ["glory/blitz-clipboard", "dep:blitz-traits", "dep:blitz-dom"]

[dependencies]
sapid = { path = "../..", features = ["json", "code", "dates", "charts", "chat"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["html", "blitz-accesskit", "blitz-raster"] }
blitz-traits = { git = "https://github.com/glory-rs/blitz", rev = "ae532b0e4d3b4e54c804d17d181b176246a64771", version = "=0.3.0-beta.4", default-features = false, optional = true }
blitz-dom = { git = "https://github.com/glory-rs/blitz", rev = "ae532b0e4d3b4e54c804d17d181b176246a64771", version = "=0.3.0-beta.4", default-features = false, optional = true }

winit = { git = "https://github.com/glory-rs/winit", rev = "d93f6db0c70fc2e1ffc10db4ff51961f0da7ea81", version = "=0.31.0-beta.4", optional = true }

[lints.rust]
unsafe_code = "forbid"

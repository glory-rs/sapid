[package]
name = "sapid-web-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sapid = { path = "../..", features = ["json", "code", "dates", "files", "charts", "chat", "editor"] }
glory = { path = "../../../glory/crates/glory", default-features = false, features = ["web", "ssr", "hydrate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "Performance", "Location", "UrlSearchParams"] }

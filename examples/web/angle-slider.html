<!doctype html><html lang="en" data-hue="blue" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>AngleSlider · Sapid</title><!--BASE_CSS--><link rel="stylesheet" href="sapid.css"><style>body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:16px;background:var(--sp-surface,#fff);color:var(--sp-text,#212529)}.angle-slider-demo{display:flex;flex-direction:column;gap:20px}.angle-slider-status{overflow-wrap:anywhere}.angle-slider-draft{width:400px}[data-gly-slider]:focus-visible{outline:3px solid #228be6;outline-offset:2px}</style></head><body><div id="app"></div><script type="module">import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;const params=new URLSearchParams(location.search),pathTheme=location.pathname.match(/angle-slider-hydrate-(blue|green)-(light|dark)/);const hue=params.get('theme')||pathTheme?.[1]||'blue',scheme=params.get('scheme')||pathTheme?.[2]||'light';document.documentElement.dataset.hue=hue;document.documentElement.dataset.mode=scheme;document.body.classList.add(`sapid-theme-${hue}-${scheme}`);if(!params.has('manual')){demo.mount_angle_slider(location.pathname.includes('hydrate'),hue,scheme);window.ready=true}else{window.moduleReady=true}</script></body></html>

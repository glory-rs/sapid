<!doctype html><html lang="en" data-hue="blue" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choices · Sapid</title><!--BASE_CSS--><link rel="stylesheet" href="sapid.css"><style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:16px;background:var(--sp-surface,#fff);color:var(--sp-text,#212529)}h1{font-size:28px}p{line-height:1.6}</style></head><body><h1>Choices</h1><p>Three-state checkboxes, permission groups and switches. All controls keep their native keyboard behavior and field labels.</p><div id="app"></div><script type="module">import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;const params=new URLSearchParams(location.search);const hue=params.get('theme')||'blue',scheme=params.get('scheme')||'light';document.documentElement.dataset.hue=hue;document.documentElement.dataset.mode=scheme;document.body.classList.add(`sapid-theme-${hue}-${scheme}`);if(!params.has('manual')){demo.mount_choices(location.pathname.includes('hydrate'),hue,scheme);window.ready=true}else{window.moduleReady=true}</script></body></html>

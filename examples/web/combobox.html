<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sapid Combobox</title><!--BASE_CSS--><link rel="icon" href="data:,"><link rel="stylesheet" href="sapid.css"><link rel="stylesheet" href="showcase.css"><style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:16px}h1{font-size:28px}</style></head><body><main><h1>Combobox</h1><p>Search suggestions with a real editable input.</p><div id="app"></div></main><script type="module">

<!doctype html><html lang="en" data-hue="blue" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Forms · Sapid</title><!--BASE_CSS--><link rel="stylesheet" href="sapid.css"><style>body{font:16px system-ui;max-width:680px;margin:32px auto;padding:16px;background:var(--sp-surface,#fff);color:var(--sp-text,#212529)}h1{font-size:28px}p{line-height:1.6}.form-snapshot{overflow-wrap:anywhere}</style></head><body><h1>Profile form</h1><p>Explicit validation and bounded successful-control snapshots. The application owns submission and reset; this example makes no network requests.</p><div id="app"></div><script type="module">import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;const params=new URLSearchParams(location.search);const pathTheme=location.pathname.match(/forms-hydrate-(blue|green)-(light|dark)/);const hue=params.get('theme')||pathTheme?.[1]||'blue',scheme=params.get('scheme')||pathTheme?.[2]||'light';document.documentElement.dataset.hue=hue;document.documentElement.dataset.mode=scheme;document.body.classList.add(`sapid-theme-${hue}-${scheme}`);if(!params.has('manual')){demo.mount_form(location.pathname.includes('hydrate'),hue,scheme);window.ready=true}else{window.moduleReady=true}</script></body></html>

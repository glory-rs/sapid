<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sapid Menu</title><!--BASE_CSS--><style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:16px}h1{font-size:28px}p{line-height:1.6}</style><link rel="icon" href="data:,"><link rel="stylesheet" href="sapid.css"><link rel="stylesheet" href="showcase.css"></head><body><main><h1>Menu</h1><p>Actions, checked preferences, radio values and nested sharing menus.</p><div id="app"></div></main><script type="module">
import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;window.moduleReady=true;

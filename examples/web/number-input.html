<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>NumberInput · Sapid</title><!--BASE_CSS--><link rel="stylesheet" href="sapid.css"><style>body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:16px;background:var(--sp-surface,#fff);color:var(--sp-text,#212529)}.number-input-demo{display:flex;flex-direction:column;gap:18px}.number-input-status{overflow-wrap:anywhere}.number-input-draft{width:400px}.sapid-number-input:focus-visible{outline:3px solid #228be6;outline-offset:2px}.sapid-number-input-row{margin:0;min-width:0}</style></head><body><div id="app"></div><script type="module">import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;const params=new URLSearchParams(location.search),match=location.pathname.match(/number-input-hydrate-(blue|green)-(light|dark)/),hue=params.get('theme')||match?.[1]||'blue',scheme=params.get('scheme')||match?.[2]||'light';document.body.classList.add(`sapid-theme-${hue}-${scheme}`);if(!params.has('manual')){demo.mount_number_input(location.pathname.includes('hydrate'),hue,scheme);window.ready=true}else window.moduleReady=true</script></body></html>

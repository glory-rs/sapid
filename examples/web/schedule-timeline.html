<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Day / Week · Sapid</title><!--BASE_CSS--><link rel="stylesheet" href="sapid.css"><style>body{font:16px system-ui;max-width:1040px;margin:24px auto;padding:16px;background:var(--sp-surface,#fff);color:var(--sp-text,#212529)}.schedule-timeline-demo{display:flex;flex-direction:column;gap:20px}.schedule-timeline-status{overflow-wrap:anywhere}.sapid-schedule-slot:focus-visible,.sapid-schedule-timeline-event:focus-visible{outline:3px solid #228be6;outline-offset:-3px}</style></head><body><div id="app"></div><script type="module">import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;const p=new URLSearchParams(location.search),m=location.pathname.match(/schedule-timeline-hydrate-(blue|green)-(light|dark)/),hue=p.get('theme')||m?.[1]||'blue',scheme=p.get('scheme')||m?.[2]||'light';document.body.classList.add(`sapid-theme-${hue}-${scheme}`);if(!p.has('manual')){demo.mount_schedule_timeline(location.pathname.includes('hydrate'),hue,scheme);window.ready=true}else window.moduleReady=true;</script></body></html>

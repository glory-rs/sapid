<!doctype html><html lang="en" data-hue="blue" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Sidebar and AppShell · Sapid</title><!--BASE_CSS--><link rel="stylesheet" href="sapid.css"><style>body{font:16px system-ui;margin:0;background:var(--sp-surface,#fff);color:var(--sp-text,#212529)}.shell-status{font-size:12px;overflow-wrap:anywhere}.sapid-shell-main{min-width:0}.sapid-sidebar-nav input{box-sizing:border-box;max-width:100%}.sapid-sidebar-nav a{display:block;padding:8px 0}</style></head><body><div id="app"></div><script type="module">import init,* as demo from './sapid_web_example.js';await init();window.demo=demo;const params=new URLSearchParams(location.search);const pathTheme=location.pathname.match(/shell-hydrate-(blue|green)-(light|dark)/);const hue=params.get('theme')||pathTheme?.[1]||'blue',scheme=params.get('scheme')||pathTheme?.[2]||'light';document.documentElement.dataset.hue=hue;document.documentElement.dataset.mode=scheme;document.body.classList.add(`sapid-theme-${hue}-${scheme}`);if(!params.has('manual')){demo.mount_shell(location.pathname.includes('hydrate'),hue,scheme);window.ready=true}else{window.moduleReady=true}</script></body></html>

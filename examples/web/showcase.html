<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Sapid showcase">
  <meta name="sapid-showcase-render" content="csr">
  <meta name="sapid-showcase-selection" content="">
  <meta name="sapid-showcase-hue" content="blue">
  <meta name="sapid-showcase-scheme" content="light">
  <title>Sapid — Rust widgets for Glory</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/sapid-logo.svg">
  <!--BASE_CSS-->
  <link rel="stylesheet" href="sapid.css">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div id="app"></div>
  <!--ROUTE_SEED-->
  <script type="module">
    import init, { start_showcase, mount_showcase } from './sapid_web_example.js';
    await init();
    window.showcase = { mount: mount_showcase };
    if (start_showcase()) window.ready = true;
    else window.moduleReady = true;
  </script>
</body>
</html>
